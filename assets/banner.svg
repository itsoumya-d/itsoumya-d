<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-label="Soumya Debnath — AI engineer banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e1a"/><stop offset="1" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e8bff"/><stop offset="1" stop-color="#3ddad7"/>
    </linearGradient>
  </defs>
  <rect width="880" height="220" fill="url(#bg)"/>
  <rect x="0" y="0" width="880" height="4" fill="url(#acc)"/>
  <rect x="0" y="216" width="880" height="4" fill="url(#acc)"/>
  <!-- circuit motif -->
  <g stroke="#2a3560" stroke-width="1.5" fill="none">
    <polyline points="60,180 140,180 180,140 260,140"/>
    <polyline points="620,40 700,40 740,80 820,80"/>
    <circle cx="260" cy="140" r="4" fill="#2a3560" stroke="none"/>
    <circle cx="620" cy="40" r="4" fill="#2a3560" stroke="none"/>
  </g>
  <!-- terminal glyph -->
  <g font-family="monospace" font-size="15" fill="#3ddad7">
    <text x="56" y="52">&gt; verifiable-reward RL</text>
    <text x="56" y="76">&gt; agent evals that survive review</text>
    <text x="56" y="100">&gt; kernels + budgets + receipts</text>
  </g>
  <text x="56" y="158" font-family="monospace" font-size="44" font-weight="600" fill="#eef1ff">Soumya Debnath</text>
  <text x="56" y="196" font-family="monospace" font-size="16" fill="url(#acc)">AI product engineer · evals · kernels · agent safety</text>
  <text x="660" y="186" font-family="monospace" font-size="13" fill="#7c86b0">RTX 2060 · reproducible</text>
</svg>
