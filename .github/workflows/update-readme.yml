name: update-readme

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    paths:
      - "README.md"
      - "sync_profile.py"
      - ".github/workflows/update-readme.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python sync_profile.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --exit-code || (git commit -m "chore: auto-sync profile activity + CI status" && git push)
