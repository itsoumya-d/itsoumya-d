name: Ask my README
description: Ask Soumya a question. A bot answers in this thread within about a minute, using live repo data.
title: "ask: "
labels: ["ask"]
body:
  - type: markdown
    attributes:
      value: |
        **Put your question in the title, after `ask:`** (for example `ask: what's your strongest project?` or `ask: tell me about PeerVault`).
        A bot replies here within about a minute. Soumya is notified too and may follow up personally.
        This issue is public, so please don't include private details.
  - type: textarea
    id: context
    attributes:
      label: Anything else? (optional)
      description: For example, the role or team you're hiring for.
    validations:
      required: false
